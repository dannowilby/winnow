[workspace]
resolver = "3"
members = ["core", "components/*"]


[workspace.dependencies]
wasmtime = "42.0.1"
wasmtime-wasi = "42.0.1"
anyhow = "1.0"
futures = "0.3"
tarpc = { version = "0.37", features = ["full"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
wit-bindgen = "0.57.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1.1.3", features = ["alloc"] }
rmp-serde = "1.1.1"
dlmalloc = { version = "0.2.13", features = ["global"] }
dashmap = "6.1.0"
rand = "0.10.1"
thiserror = "2"
indicatif = "0.18.4"
sysinfo = "0.39.5"