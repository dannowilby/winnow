[workspace]
resolver = "3"
members = ["server", "components/*"]


[workspace.dependencies]
wasmtime = "42.0.1"
wasmtime-wasi = "42.0.1"
anyhow = "1.0"
futures = "0.3"
tarpc = { version = "0.37", features = ["tokio1"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
wit-bindgen = "0.57.1"
serde = "1.0.228"
serde_bytes = "0.11"
postcard = "1.1.3"