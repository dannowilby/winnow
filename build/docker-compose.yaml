version: '3.9'

x-mapreduce: &mapreduce
  build:
    context: ..
    dockerfile: build/Dockerfile
  image: mapreduce-rs:latest
  network_mode: host
  restart: unless-stopped

services:
  node0:
    <<: *mapreduce
    environment:
      PORT: "3000"

  node1:
    <<: *mapreduce
    environment:
      PORT: "3001"

  node2:
    <<: *mapreduce
    environment:
      PORT: "3002"
