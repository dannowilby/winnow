x-mapreduce: &mapreduce
  build:
    context: ..
    dockerfile: build/Dockerfile
  image: mapreduce-rs:latest
  network_mode: host
  restart: unless-stopped
  # Nodes export traces/metrics/logs to the collector. They run on the host
  # network, so the collector is reachable on localhost at its published port.
  depends_on:
    - otel-collector

services:
  # ---------------------------------------------------------------------------
  # MapReduce cluster
  # ---------------------------------------------------------------------------
  node0:
    <<: *mapreduce
    environment:
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
      OTEL_SERVICE_INSTANCE_ID: "node0"

  node1:
    <<: *mapreduce
    environment:
      PORT: "3001"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
      OTEL_SERVICE_INSTANCE_ID: "node1"

  node2:
    <<: *mapreduce
    environment:
      PORT: "3002"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
      OTEL_SERVICE_INSTANCE_ID: "node2"

  # ---------------------------------------------------------------------------
  # Observability stack
  # ---------------------------------------------------------------------------

  # Single OTLP entry point for the cluster. Fans traces -> Tempo,
  # metrics -> Prometheus (scraped), logs -> Loki.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (from the cluster nodes)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - tempo
      - loki
      - prometheus

  # Traces backend.
  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP / query API
    networks:
      - observability
    restart: unless-stopped

  # Logs backend.
  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability
    restart: unless-stopped

  # Metrics backend.
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
    restart: unless-stopped

  # Dashboards. Datasources are provisioned automatically; open
  # http://localhost:3030 (anonymous admin access enabled for local use).
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3030:3000"   # mapped off 3000 to avoid clashing with node0
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  observability:
    driver: bridge

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
