name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      # trigger release workflow only if this file changed
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build caching
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build -p server --bin mapreduce_bin --bin mapreduce_cli --release

      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          release_name="winnow-${GITHUB_REF_NAME}-${RUNNER_OS}-${RUNNER_ARCH}"
          mkdir -p dist/package
          cp target/release/mapreduce_bin dist/package/winnow-server
          cp target/release/mapreduce_cli dist/package/winnow
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/${release_name}.tar.gz" .

      - name: Package release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseName = "winnow-${env:GITHUB_REF_NAME}-${env:RUNNER_OS}-${env:RUNNER_ARCH}"
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item -Path target/release/mapreduce_bin.exe -Destination dist/package/winnow-server.exe
          Copy-Item -Path target/release/mapreduce_cli.exe -Destination dist/package/winnow.exe
          Copy-Item -Path README.md, LICENSE -Destination dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${releaseName}.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Build release notes
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          git fetch --force origin "${tag_ref}:${tag_ref}"
          git for-each-ref "${tag_ref}" --format='%(contents)' > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            commit_sha="$(git rev-list -n 1 "${tag_ref}")"
            git log -1 --pretty=%B "${commit_sha}" > RELEASE_NOTES.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true
